<DOCTYPE HTML>
  <html lang="es">
    <head>
      <meta charset="UTF-8">
      <TITLE>HOJA DE VIDA</TITLE>
    </head>
    <body>
      <h1>HOJA DE VIDA</h1>
      <form>
        <h2>DATOS PERSONALES</h2>
        <label>FECHA</label>
        <input type="datetime-local">
        <label for="apellido">APELLIDO</label>
        <input type="text" name="apellido" placeholder="Perez" required><!--type es el tipo de input del formulario ; name se usa para identificar al input ; placehoolder se usa para dar un ejemplo de uso a el campo : required se usa para dar a entender que el campo es obligatorio-->
        <label for="nombre">NOMBRE</label>
        <input type="text" name="nombre" placeholder="Pedro">
        <label for="direccion">DIRECCION DE DOMICILIO</label>
        <input type="text" name="direccion" id="">
        <label for="ciudad">CIUDAD</label>
        <input type="text" name="ciudad" id="">
        <label for="celular">NUMERO DE CONTACTO</label>
        <input type="number" name="celular" id="">
        <label for="correo">CORREO ELECTRONICO</label>
        <input type="email" name="correo" id="">
        <label for="estado-civil">ESTADO CIVIL</label>
        <input type="radio" name="estado-civil" value="SOLTERO">SOLTERO</input>
        <input type="radio" name="estado-civil" value="CASADO">CASADO</input>
        <input type="radio" name="estado-civil" value="DIVORCIADO">DIVORCIADO</input>
        <input type="radio" name="estado-civil" value="OTRO">OTRO</input>
        <label for="profecion">PROFEXI&Oacute;N, OCUPACI&Oacute;N U OFICIO</label>
        <h2>DOCUMENTACION</h2>
      <label for="documento">DOCUMENTO DE IDENTIDAD</label>
      <input type="radio" name="documento" id="">CEDULA DE CIUDADANIA</input>
      <input type="radio" name="documento" id="">CEDULA DE EXTRANJERIA</input>
      <label for="numero-documento">NUMERO DE DOCUMENTO</label>
      <input type="text" name="numero-documento" id="">
      </form>
    </body>
  </html>
